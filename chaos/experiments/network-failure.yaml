apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: order-to-user-network-partition
  namespace: self-healing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - self-healing
    labelSelectors:
      app: order-service
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - self-healing
      labelSelectors:
        app: user-service
  duration: "30s"
